# Cloud Run service spec. Used as documentation; `gcloud run deploy --source .` is the path.
# Do not set GEMINI_API_KEY, OPENAI_API_KEY, or ANTHROPIC_API_KEY.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: redthread-ledger
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: IMAGE_REPLACED_AT_DEPLOY
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: DEMO_MODE
              value: "true"
            - name: CORS_ORIGINS
              value: "*"
            - name: PORT
              value: "8080"
            - name: STATIC_DIR
              value: /app/frontend/dist
            - name: HACKATHON_STATEMENTS_DIR
              value: /data/hackathon/bank-statements
            - name: HACKATHON_REFERENCE_DIR
              value: /data/hackathon/reference-data
            - name: AGENT_ENABLED
              value: "false"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
