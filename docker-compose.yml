services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATA_DIR: /data
      HACKATHON_STATEMENTS_DIR: /data/hackathon/bank-statements
      HACKATHON_REFERENCE_DIR: /data/hackathon/reference-data
      DEMO_DATA_DIR: /data/demo
    volumes:
      - ./data:/data:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on:
      - backend
